_schema-version: 3.3.0
ID: capSample
description: A simple CAP project.
version: 1.0.0
modules:
  - name: capSample-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: capSample-db
      - name: capSample-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: capSample-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: capSample-db
    parameters:
      buildpack: nodejs_buildpack
  - name: capSample-destination-content
    type: com.sap.application.content
    requires:
      - name: capSample-destination-service
        parameters:
          content-target: true
      - name: capSample_html_repo_host
        parameters:
          service-key:
            name: capSample_html_repo_host-key
      - name: capSample-auth
        parameters:
          service-key:
            name: capSample-auth-key
    parameters:
      content:
        instance:
          destinations:
            - Name: capSampleApprouter_capSample_html_repo_host
              ServiceInstanceName: capSample-html5-app-host-service
              ServiceKeyName: capSample_html_repo_host-key
              sap.cloud.service: capSampleApprouter
            - Authentication: OAuth2UserTokenExchange
              Name: capSampleApprouter_capSample_auth
              ServiceInstanceName: capSample-auth
              ServiceKeyName: capSample-auth-key
              sap.cloud.service: capSampleApprouter
          existing_destinations_policy: ignore
    build-parameters:
      no-source: true
resources:
  - name: capSample-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: capSample-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: capSample-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
  - name: capSample-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
      service: destination
      service-name: capSample-destination-service
      service-plan: lite
  - name: capSample_html_repo_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: capSample-html5-app-host-service
      service-plan: app-host
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
